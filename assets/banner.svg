<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0612"/>
      <stop offset="0.55" stop-color="#1a0b33"/>
      <stop offset="1" stop-color="#04140d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39ff14" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff14" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <!-- top / bottom EVA bars -->
    <rect y="0" width="1000" height="6" fill="#7b2cbf"/>
    <rect y="254" width="1000" height="6" fill="#7b2cbf"/>
    <rect y="0" width="160" height="6" fill="#39ff14">
      <animate attributeName="x" values="-160;1000" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect y="254" width="160" height="6" fill="#39ff14">
      <animate attributeName="x" values="1000;-160" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- hexagon core (right) -->
    <g fill="none" stroke-width="2">
      <polygon points="920,130 885,190.6 815,190.6 780,130 815,69.4 885,69.4" stroke="#7b2cbf" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
      </polygon>
      <g>
        <polygon points="895,130 872.5,169 827.5,169 805,130 827.5,91 872.5,91" stroke="#39ff14" filter="url(#glow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 850 130" to="360 850 130" dur="14s" repeatCount="indefinite"/>
      </g>
      <polygon points="870,130 860,147 840,147 830,130 840,113 860,113" stroke="#b44cff">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- scan band -->
    <rect width="1000" height="70" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0,-70;0,260" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets -->
    <g stroke="#39ff14" stroke-width="2" fill="none" opacity="0.8">
      <path d="M24 30V20H34"/>
      <path d="M976 30V20H966"/>
      <path d="M24 230V240H34"/>
      <path d="M976 230V240H966"/>
    </g>

    <!-- top tag line -->
    <text x="60" y="44" font-family="'Courier New', monospace" font-size="13" fill="#b44cff" letter-spacing="2">NERV // MAGI-SYSTEM  ·  PILOT: ILEANA  ·  UNIT-01</text>
    <circle cx="738" cy="40" r="4" fill="#39ff14">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="748" y="44" font-family="'Courier New', monospace" font-size="13" fill="#39ff14" letter-spacing="2">ONLINE</text>

    <!-- glitch title -->
    <text x="60" y="115" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="#b44cff" opacity="0.85">ILEANA TAPIA CASTILLO
      <animate attributeName="x" values="60;56;64;60;60;62;60" keyTimes="0;0.05;0.1;0.15;0.8;0.85;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="115" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="#39ff14" filter="url(#glow)">ILEANA TAPIA CASTILLO
      <animate attributeName="opacity" values="1;1;0.6;1;1;0.8;1" keyTimes="0;0.05;0.08;0.12;0.8;0.84;1" dur="3.5s" repeatCount="indefinite"/>
    </text>

    <!-- subtitles -->
    <text x="60" y="152" font-family="'Courier New', monospace" font-size="16" fill="#d9c8ff">Computer Technologies Engineering · Tec de Monterrey · Toluca</text>
    <text x="60" y="178" font-family="'Courier New', monospace" font-size="14" fill="#39ff14" opacity="0.85">full-stack  //  biomedical software  //  IoT  //  AI pipelines</text>

    <!-- sync rate bar -->
    <text x="60" y="212" font-family="'Courier New', monospace" font-size="12" fill="#b44cff" letter-spacing="2">SYNC RATE</text>
    <rect x="150" y="203" width="300" height="10" fill="none" stroke="#39ff14" stroke-width="1.5"/>
    <rect x="150" y="203" width="0" height="10" fill="#39ff14" filter="url(#glow)">
      <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.6;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="462" y="212" font-family="'Courier New', monospace" font-size="12" fill="#39ff14" letter-spacing="2">400%</text>
  </g>
</svg>
